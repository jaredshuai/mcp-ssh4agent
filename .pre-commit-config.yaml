repos:
  # JavaScript/TypeScript checks
  - repo: local
    hooks:
      - id: check-js-syntax
        name: Check JavaScript/TypeScript syntax
        entry: node --check
        language: system
        files: '\.(js|ts)$'
        
      - id: biome
        name: Biome (lint + format)
        entry: npx @biomejs/biome check --write
        language: system
        files: '\.(js|ts)$'
        require_serial: false
        
      - id: biome-format-json
        name: Biome JSON format
        entry: npx @biomejs/biome format --write
        language: system
        files: '\.json$'
        exclude: 'package-lock\.json'

  # General checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: 'package-lock\.json'
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: detect-private-key

  # Custom validation hooks
  - repo: local
    hooks:
      - id: test-profiles
        name: Test Profile System
        entry: node tests/test-profiles.js
        language: system
        pass_filenames: false
        files: 'profiles/.*\.json$|src/profile-loader\.ts$'
        
      - id: test-aliases
        name: Test Command Aliases
        entry: node tests/test-command-aliases.js
        language: system
        pass_filenames: false
        files: 'src/command-aliases\.ts$'
        
      - id: test-hooks
        name: Test Hooks System
        entry: node tests/test-hooks.js
        language: system
        pass_filenames: false
        files: 'src/hooks-system\.ts$'
